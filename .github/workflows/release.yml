name: Release

# Runs in THIS public repo (Actions are free for public repos) and builds every
# release artifact from the PRIVATE source repo veildawn/ai-proxy-service: the
# linux archives, the loose install assets, and the multi-arch ghcr image. The
# source repo has no workflows at all, so this is the whole release. Two ways to
# cut one:
#   * workflow_dispatch — enter the version + source ref.
#   * push a v* tag to THIS repo — builds the same-named ref of the source repo.
# Run the CI workflow against the same ref first; nothing else tests it.
# Secrets: SOURCE_REPO_TOKEN — PAT with Contents:read on the source repo.
#          GHCR_TOKEN       — PAT with write:packages (see the image job).
# Publishing the release itself uses this repo's own GITHUB_TOKEN.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version tag, e.g. v1.2.3"
        required: true
      source_ref:
        description: "Source repo ref to build (branch, tag, or SHA)"
        required: true
        default: main
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  SOURCE_REPO: veildawn/ai-proxy-service
  IMAGE: ghcr.io/veildawn/ai-proxy-service

jobs:
  # Resolve version + source ref once so build and release agree regardless of
  # whether we were triggered by a manual dispatch or a v* tag push.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      source_ref: ${{ steps.v.outputs.source_ref }}
    steps:
      - id: v
        # The inputs go through env, never inline into the script: an inline
        # ${{ }} is substituted before bash parses it, so the shape check below
        # would run too late to matter.
        env:
          IN_VERSION: ${{ inputs.version }}
          IN_SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="$IN_VERSION"
            R="$IN_SOURCE_REF"
          else
            V="${GITHUB_REF_NAME}"
            R="${GITHUB_REF_NAME}"
          fi
          case "$V" in v*) : ;; *) V="v$V" ;; esac
          case "$V" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::version must look like vX.Y.Z, got '$V'"; exit 1 ;;
          esac
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "source_ref=$R" >> "$GITHUB_OUTPUT"
          echo "Resolved version=$V source_ref=$R"

  build:
    needs: prepare
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            goarch: amd64
          - runner: ubuntu-24.04-arm
            goarch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout private source
        uses: actions/checkout@v7
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ needs.prepare.outputs.source_ref }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Build frontend
        working-directory: web/ai-proxy-web
        run: |
          corepack enable
          pnpm install --frozen-lockfile || pnpm install
          pnpm build

      - name: Embed frontend
        run: |
          rm -rf internal/api/spa/static/*
          cp -R web/ai-proxy-web/build/client/* internal/api/spa/static/

      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"

      - name: Build binary
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          VERSION="${VERSION#v}"
          COMMIT="$(git rev-parse --short HEAD)"
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          MODULE=github.com/veildawn/ai-proxy-service
          mkdir -p dist
          CGO_ENABLED=0 go build -trimpath -buildvcs=false \
            -ldflags "-s -w \
              -X ${MODULE}/internal/buildinfo.Version=${VERSION} \
              -X ${MODULE}/internal/buildinfo.Commit=${COMMIT} \
              -X ${MODULE}/internal/buildinfo.BuildDate=${BUILD_DATE} \
              -X ${MODULE}/internal/buildinfo.BuildType=release" \
            -o dist/ai-proxy-service ./cmd/server

      - name: Package
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          VERSION="${VERSION#v}"
          # install.sh copies config.example.yaml out of the archive to seed
          # config.yaml, so shipping the binary alone breaks every fresh install.
          stage="$(mktemp -d)"
          cp dist/ai-proxy-service "$stage/"
          cp config.example.yaml .env.example "$stage/"
          # The self-updater matches assets by the _linux_<arch>.tar.gz suffix
          # and extracts the "ai-proxy-service" entry — keep both names stable.
          tar -czf "dist/ai-proxy-service_${VERSION}_linux_${{ matrix.goarch }}.tar.gz" \
            -C "$stage" .
          rm -rf "$stage"
          echo "== archive contents =="
          tar -tzf "dist/ai-proxy-service_${VERSION}_linux_${{ matrix.goarch }}.tar.gz"

      # Fetched by the one-line installer and the docker quickstart, so they are
      # versioned alongside the binaries they know how to install. Arch-neutral —
      # stage them once rather than racing two uploads of the same names.
      - name: Stage loose assets
        if: matrix.goarch == 'amd64'
        run: |
          mkdir -p extras
          cp deploy/scripts/install.sh extras/install.sh
          cp deploy/docker/docker-compose.release.yml extras/docker-compose.yml
          cp deploy/docker/.env.example extras/env.example

      - uses: actions/upload-artifact@v7
        with:
          name: archive-linux-${{ matrix.goarch }}
          path: dist/*.tar.gz
          retention-days: 3

      - uses: actions/upload-artifact@v7
        if: matrix.goarch == 'amd64'
        with:
          name: extras
          path: extras/*
          retention-days: 3

  # The multi-arch image, built from the same source ref as the archives so a
  # version means one thing across both install paths.
  image:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private source
        uses: actions/checkout@v7
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ needs.prepare.outputs.source_ref }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          fetch-depth: 0

      - id: v
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          {
            echo "version=${VERSION#v}"
            echo "commit=$(git rev-parse HEAD)"
            echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # The ghcr package is owned by the user and linked to the source repo,
          # so this repo's GITHUB_TOKEN cannot write to it. GHCR_TOKEN is a PAT
          # with write:packages, which is scoped to the user rather than a repo.
          password: ${{ secrets.GHCR_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.v.outputs.version }}
            ${{ env.IMAGE }}:latest
          build-args: |
            VERSION=${{ steps.v.outputs.version }}
            COMMIT=${{ steps.v.outputs.commit }}
            BUILD_DATE=${{ steps.v.outputs.date }}
            BUILD_TYPE=release
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        # "<sha256>  <name>" — the exact format internal/update verifies against.
        run: |
          sha256sum *.tar.gz > checksums.txt
          cat checksums.txt

      - name: Release notes
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          SOURCE_REF: ${{ needs.prepare.outputs.source_ref }}
        run: |
          cat > notes.md <<EOF
          ## Install

          \`\`\`bash
          curl -fsSL https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/install.sh | sudo bash
          \`\`\`

          ### Docker

          \`\`\`bash
          curl -fsSL https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/docker-compose.yml -o docker-compose.yml
          curl -fsSL https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/env.example -o .env
          # fill in the secrets in .env, then:
          docker compose up -d
          \`\`\`

          Image: \`ghcr.io/veildawn/ai-proxy-service:${VERSION#v}\`

          Linux amd64/arm64 binaries plus \`checksums.txt\`. Built from source ref
          \`${SOURCE_REF}\`; source and docs live in the private source repository.
          EOF

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          # Published here, in this public repo, with the built-in GITHUB_TOKEN.
          # tag_name is explicit so manual dispatches create the tag; a tag-push
          # trigger simply attaches the release to the tag that already exists.
          tag_name: ${{ needs.prepare.outputs.version }}
          name: ${{ needs.prepare.outputs.version }}
          body_path: notes.md
          files: dist/*
