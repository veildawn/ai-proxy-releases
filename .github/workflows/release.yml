name: Release

# Runs in THIS public repo (Actions are free for public repos) and builds every
# release artifact from the PRIVATE source repo veildawn/ai-proxy-service: the
# linux archives, the loose install assets, and the multi-arch ghcr image. The
# source repo has no workflows at all, so this is the whole release. Ways to
# cut one:
#   * workflow_dispatch — enter the version + source ref.
#   * push a v* tag to THIS repo — builds the same-named ref of the source repo.
#   * workflow_call — used by release-request.yml when a request JSON is pushed
#     (agent/bot-friendly; workflow_dispatch is often denied to installation tokens).
# Run the CI workflow against the same ref first; nothing else tests it.
# Secrets: SOURCE_REPO_TOKEN — PAT with Contents:read on the source repo.
# Publishing the release itself uses this repo's own GITHUB_TOKEN.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version tag, e.g. v1.2.3"
        required: true
        type: string
      source_ref:
        description: "Source repo ref to build (branch, tag, or SHA)"
        required: true
        default: main
        type: string
      changelog:
        description: "更新内容 (Chinese plain text, one bullet per change; omitted from the notes when blank)"
        required: false
        type: string
  workflow_call:
    inputs:
      version:
        description: "Release version tag, e.g. v1.2.3"
        required: true
        type: string
      source_ref:
        description: "Source repo ref to build (branch, tag, or SHA)"
        required: true
        type: string
      changelog:
        description: "更新内容 (Chinese plain text)"
        required: false
        type: string
        default: ""
      since_sha:
        description: "If set, abort when source_ref resolves to this SHA; also used to auto-fill changelog"
        required: false
        type: string
        default: ""
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  SOURCE_REPO: veildawn/ai-proxy-service
  # ai-proxy-release, not ai-proxy-service: a repository's GITHUB_TOKEN only
  # writes packages its own repository owns, and ai-proxy-service belongs to the
  # source repo — pushing it from here 403s at the blob upload.
  IMAGE: ghcr.io/veildawn/ai-proxy-release

jobs:
  # Resolve version + source ref once so build and release agree regardless of
  # whether we were triggered by a manual dispatch, a reusable call, or a v* tag.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      source_ref: ${{ steps.v.outputs.source_ref }}
      changelog: ${{ steps.v.outputs.changelog }}
      should_release: ${{ steps.v.outputs.should_release }}
    steps:
      - id: v
        # The inputs go through env, never inline into the script: an inline
        # ${{ }} is substituted before bash parses it, so the shape check below
        # would run too late to matter.
        env:
          IN_VERSION: ${{ inputs.version }}
          IN_SOURCE_REF: ${{ inputs.source_ref }}
          IN_CHANGELOG: ${{ inputs.changelog }}
          IN_SINCE_SHA: ${{ inputs.since_sha }}
          REF_NAME: ${{ github.ref_name }}
          SOURCE_REPO_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          CHANGELOG=""
          SINCE_SHA=""
          SHOULD_RELEASE=true

          # github.event_name stays the CALLER's event when this file is used via
          # workflow_call (so a push-triggered request relay still reports
          # "push" here). Treat a non-empty inputs.version as the dispatch/call
          # path; only bare tag pushes fall through to GITHUB_REF_NAME.
          if [ -n "${IN_VERSION:-}" ]; then
            V="$IN_VERSION"
            R="${IN_SOURCE_REF:-main}"
            CHANGELOG="${IN_CHANGELOG:-}"
            SINCE_SHA="${IN_SINCE_SHA:-}"
          else
            V="$REF_NAME"
            R="$REF_NAME"
          fi

          case "$V" in v*) : ;; *) V="v$V" ;; esac
          case "$V" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::version must look like vX.Y.Z, got '$V'"; exit 1 ;;
          esac

          # Resolve source_ref to a full SHA and optionally fill the changelog
          # from commits since since_sha (or abort when there is nothing new).
          if [ -n "${SOURCE_REPO_TOKEN:-}" ]; then
            tmp="$(mktemp -d)"
            git -C "$tmp" init -q
            git -C "$tmp" remote add origin "https://x-access-token:${SOURCE_REPO_TOKEN}@github.com/${SOURCE_REPO}.git"
            if [ -n "$SINCE_SHA" ]; then
              git -C "$tmp" fetch -q --depth=100 origin "$R"
            else
              git -C "$tmp" fetch -q --depth=1 origin "$R"
            fi
            RESOLVED="$(git -C "$tmp" rev-parse FETCH_HEAD)"
            echo "Resolved source SHA: $RESOLVED (from ref $R)"
            if [ -n "$SINCE_SHA" ]; then
              if [ "$RESOLVED" = "$SINCE_SHA" ]; then
                echo "::warning::source_ref $R resolves to $RESOLVED, same as since_sha — nothing new to release"
                SHOULD_RELEASE=false
              elif [ -z "$CHANGELOG" ]; then
                # Plain-text notes for the admin update panel (no markdown).
                # Shallow fetch may not contain since_sha; deepen if needed.
                if ! git -C "$tmp" cat-file -e "${SINCE_SHA}^{commit}" 2>/dev/null; then
                  git -C "$tmp" fetch -q --deepen=200 origin "$R" || true
                  git -C "$tmp" fetch -q --depth=1 origin "$SINCE_SHA" || true
                fi
                {
                  echo "更新"
                  git -C "$tmp" log --reverse --format='· %s' "${SINCE_SHA}..${RESOLVED}" \
                    | sed '/^· Merge /d'
                } > /tmp/auto-changelog.txt
                if [ "$(wc -l < /tmp/auto-changelog.txt)" -le 1 ]; then
                  echo "::warning::no commits between $SINCE_SHA and $RESOLVED"
                  SHOULD_RELEASE=false
                else
                  CHANGELOG="$(cat /tmp/auto-changelog.txt)"
                  echo "== auto changelog =="
                  printf '%s\n' "$CHANGELOG"
                fi
              fi
            fi
            R="$RESOLVED"
            rm -rf "$tmp"
          else
            echo "::warning::SOURCE_REPO_TOKEN missing; leaving source_ref unresolved"
          fi

          {
            echo "version=$V"
            echo "source_ref=$R"
            echo "should_release=$SHOULD_RELEASE"
            echo "changelog<<EOF_CHANGELOG"
            printf '%s\n' "$CHANGELOG"
            echo "EOF_CHANGELOG"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved version=$V source_ref=$R should_release=$SHOULD_RELEASE"

  build:
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    strategy:
      matrix:
        # The build is CGO_ENABLED=0 pure Go, so the darwin and windows targets
        # cross-compile on a linux runner — no mac/windows runners needed. Only
        # linux/arm64 keeps a native runner, as it already had one.
        include:
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
          - runner: ubuntu-latest
            goos: darwin
            goarch: amd64
          - runner: ubuntu-latest
            goos: darwin
            goarch: arm64
          - runner: ubuntu-latest
            goos: windows
            goarch: amd64
    runs-on: ${{ matrix.runner }}
    steps:
      # Depth 1 (the default): the only git use below is rev-parse HEAD, so the
      # full-history fetch was pure wait.
      - name: Checkout private source
        uses: actions/checkout@v7
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ needs.prepare.outputs.source_ref }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # Must run after setup-node (the shim lands next to that node) and before
      # `pnpm store path` below.
      - run: corepack enable

      - name: Locate pnpm store
        id: pnpm-store
        working-directory: web/ai-proxy-web
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      # All caches live in this repo (actions/cache is scoped to the repo the
      # workflow runs in); the nightly CI run keeps the shared ones warm.
      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('web/ai-proxy-web/pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-${{ runner.arch }}-

      - name: Build frontend
        working-directory: web/ai-proxy-web
        run: |
          pnpm install --frozen-lockfile || pnpm install
          pnpm build

      - name: Embed frontend
        run: |
          rm -rf internal/api/spa/static/*
          cp -R web/ai-proxy-web/build/client/* internal/api/spa/static/

      # cache: false — setup-go's built-in cache keys only on go.sum, so the
      # five legs would race to save one shared entry and whichever GOOS/GOARCH
      # saved first would be the only build cache ever kept.
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: false

      - uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: go-mod-${{ hashFiles('go.sum') }}
          restore-keys: go-mod-

      # Keyed per target: GOCACHE entries are GOOS/GOARCH-specific. Per-run key
      # + prefix restore = always save a fresh snapshot, restore the newest.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: go-build-rel-${{ matrix.goos }}-${{ matrix.goarch }}-${{ github.run_id }}
          restore-keys: go-build-rel-${{ matrix.goos }}-${{ matrix.goarch }}-

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          VERSION="${VERSION#v}"
          COMMIT="$(git rev-parse --short HEAD)"
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          MODULE=github.com/veildawn/ai-proxy-service
          # internal/update looks for this exact name inside the archive, and on
          # windows it looks for it with the .exe suffix.
          # Not `[ ... ] && BIN=...`: the runner's shell is `bash -e`, and that
          # statement returns 1 on every non-windows target, killing the step.
          BIN=ai-proxy-service
          if [ "$GOOS" = "windows" ]; then
            BIN="${BIN}.exe"
          fi
          echo "bin=$BIN" >> "$GITHUB_ENV"
          mkdir -p dist
          CGO_ENABLED=0 go build -trimpath -buildvcs=false \
            -ldflags "-s -w \
              -X ${MODULE}/internal/buildinfo.Version=${VERSION} \
              -X ${MODULE}/internal/buildinfo.Commit=${COMMIT} \
              -X ${MODULE}/internal/buildinfo.BuildDate=${BUILD_DATE} \
              -X ${MODULE}/internal/buildinfo.BuildType=release" \
            -o "dist/${BIN}" ./cmd/server

      - name: Package
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          VERSION="${VERSION#v}"
          # install.sh copies config.example.yaml out of the archive to seed
          # config.yaml, so shipping the binary alone breaks every fresh install.
          stage="$(mktemp -d)"
          cp "dist/${bin}" "$stage/"
          cp config.example.yaml .env.example "$stage/"
          # internal/update matches assets by the _<goos>_<arch> infix plus the
          # platform's extension, then extracts the "ai-proxy-service" entry
          # (".exe" on windows) — keep all three stable. Windows gets a zip so it
          # opens with a double-click; the updater reads both formats.
          base="dist/ai-proxy-service_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}"
          echo "== archive contents =="
          if [ "${{ matrix.goos }}" = "windows" ]; then
            # -j: no directory prefix, so entries sit at the zip root the way
            # tar -C stages them for the other platforms.
            (cd "$stage" && zip -qrj "${GITHUB_WORKSPACE}/${base}.zip" .)
            unzip -l "${base}.zip"
          else
            tar -czf "${base}.tar.gz" -C "$stage" .
            tar -tzf "${base}.tar.gz"
          fi
          rm -rf "$stage"

      # Fetched by the one-line installer and the docker quickstart, so they are
      # versioned alongside the binaries they know how to install. Arch-neutral —
      # stage them once rather than racing two uploads of the same names.
      - name: Stage loose assets
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          mkdir -p extras
          cp deploy/scripts/install.sh extras/install.sh
          cp deploy/docker/docker-compose.release.yml extras/docker-compose.yml
          cp deploy/docker/.env.example extras/env.example

      - uses: actions/upload-artifact@v7
        with:
          name: archive-${{ matrix.goos }}-${{ matrix.goarch }}
          # Both globs: the windows job produces a .zip and no .tar.gz.
          path: |
            dist/*.tar.gz
            dist/*.zip
          retention-days: 3

      - uses: actions/upload-artifact@v7
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        with:
          name: extras
          path: extras/*
          retention-days: 3

  # The multi-arch image, assembled from the same binaries the build matrix
  # just produced so a version means one thing across both install paths.
  # Rebuilding go + the frontend inside buildx used to be the slowest part of
  # the whole release (~3 minutes, no persistent GOCACHE in there): now
  # BINARY_SRC=prebuilt makes the Dockerfile COPY the matrix output and skip
  # both builder stages entirely, and the remaining runtime layers come out of
  # the gha layer cache.
  image:
    needs: [prepare, build]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    # packages:write is what lets GITHUB_TOKEN push to ghcr. Naming any
    # permission here drops the rest to none, hence contents:read — the source
    # checkout below uses its own PAT, so nothing else needs this token.
    permissions:
      contents: read
      packages: write
    steps:
      # Still needed even with prebuilt binaries: the build context carries the
      # Dockerfile, entrypoint, and config.example.yaml.
      - name: Checkout private source
        uses: actions/checkout@v7
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ needs.prepare.outputs.source_ref }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}

      # Downloaded outside the workspace so the archives don't ride along in
      # the docker build context; only the extracted binaries below do.
      - uses: actions/download-artifact@v8
        with:
          pattern: archive-linux-*
          path: ${{ runner.temp }}/prebuilt-archives
          merge-multiple: true

      # dist/prebuilt/linux/<arch>/ai-proxy-service is the exact layout the
      # Dockerfile's binary-prebuilt stage COPYs from (keyed by TARGETARCH).
      # Extract-then-move rather than naming the tar member: the archives store
      # entries with a ./ prefix.
      - name: Unpack prebuilt binaries
        run: |
          for arch in amd64 arm64; do
            mkdir -p "dist/prebuilt/linux/${arch}" "${RUNNER_TEMP}/unpack"
            tar -xzf "${RUNNER_TEMP}"/prebuilt-archives/ai-proxy-service_*_linux_"${arch}".tar.gz -C "${RUNNER_TEMP}/unpack"
            mv "${RUNNER_TEMP}/unpack/ai-proxy-service" "dist/prebuilt/linux/${arch}/ai-proxy-service"
            rm -rf "${RUNNER_TEMP}/unpack"
          done
          ls -lR dist/prebuilt

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # GITHUB_TOKEN, not a PAT: this repo's token can push to the package
          # once the job asks for packages:write above. The GHCR_TOKEN this used
          # to name was never set, so every image job here failed at login.
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: v
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: echo "version=${VERSION#v}" >> "$GITHUB_OUTPUT"

      # VERSION/COMMIT/BUILD_DATE/BUILD_TYPE args are gone: they only fed the
      # go-builder stage, which a prebuilt build never runs — the values are
      # already baked into the binaries by the build matrix.
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.v.outputs.version }}
            ${{ env.IMAGE }}:latest
          build-args: |
            BINARY_SRC=prebuilt
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: [prepare, build]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        # "<sha256>  <name>" — the exact format internal/update verifies against.
        # The .zip has to be in here too: the updater refuses any archive it
        # cannot find a checksum for, so omitting it silently breaks windows
        # self-update rather than failing the release.
        run: |
          sha256sum *.tar.gz *.zip > checksums.txt
          cat checksums.txt

      # The notes render inside the admin panel's update dialog, which is a
      # plain-text (whitespace-pre-wrap) box — NOT markdown — and must carry
      # only 更新内容: no install/deploy steps, no artifact rundown, no markdown
      # syntax (a `##` would show its literal hashes). So the body IS the
      # changelog, verbatim. Written in Chinese; see the source repo's
      # docs/design/update-system.md §5.3 for the format.
      - name: Release notes
        env:
          CHANGELOG: ${{ needs.prepare.outputs.changelog }}
        run: |
          # printf, not a heredoc: the changelog is free text from a dispatch
          # input, and an unquoted heredoc would run any `backticks` in it.
          printf '%s\n' "$CHANGELOG" > notes.md
          echo "== notes.md =="
          cat notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          # Published here, in this public repo, with the built-in GITHUB_TOKEN.
          # tag_name is explicit so manual dispatches create the tag; a tag-push
          # trigger simply attaches the release to the tag that already exists.
          tag_name: ${{ needs.prepare.outputs.version }}
          name: ${{ needs.prepare.outputs.version }}
          body_path: notes.md
          files: dist/*
