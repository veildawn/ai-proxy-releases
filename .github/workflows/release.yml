name: Release

# Runs in THIS public repo (Actions are free for public repos) and builds the
# packaged artifacts from the PRIVATE source repo veildawn/ai-proxy-service,
# then publishes a GitHub Release here. Two ways to cut a release:
#   * workflow_dispatch — enter the version + source ref manually.
#   * push a v* tag to THIS repo — builds the same-named ref of the source repo.
# Requires SOURCE_REPO_TOKEN: a PAT with Contents:read on the private source
# repo (stored as a secret in this repo). Publishing the release uses this
# repo's own GITHUB_TOKEN — no cross-repo write token is needed.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version tag, e.g. v1.2.3"
        required: true
      source_ref:
        description: "Source repo ref to build (branch, tag, or SHA)"
        required: true
        default: main
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  SOURCE_REPO: veildawn/ai-proxy-service

jobs:
  # Resolve version + source ref once so build and release agree regardless of
  # whether we were triggered by a manual dispatch or a v* tag push.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      source_ref: ${{ steps.v.outputs.source_ref }}
    steps:
      - id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ inputs.version }}"
            R="${{ inputs.source_ref }}"
          else
            V="${GITHUB_REF_NAME}"
            R="${GITHUB_REF_NAME}"
          fi
          case "$V" in v*) : ;; *) V="v$V" ;; esac
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "source_ref=$R" >> "$GITHUB_OUTPUT"
          echo "Resolved version=$V source_ref=$R"

  build:
    needs: prepare
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            goarch: amd64
          - runner: ubuntu-24.04-arm
            goarch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout private source
        uses: actions/checkout@v7
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ needs.prepare.outputs.source_ref }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Build frontend
        working-directory: web/ai-proxy-web
        run: |
          corepack enable
          pnpm install --frozen-lockfile || pnpm install
          pnpm build

      - name: Embed frontend
        run: |
          rm -rf internal/api/spa/static/*
          cp -R web/ai-proxy-web/build/client/* internal/api/spa/static/

      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"

      - name: Build binary
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          VERSION="${VERSION#v}"
          COMMIT="$(git rev-parse --short HEAD)"
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          MODULE=github.com/veildawn/ai-proxy-service
          mkdir -p dist
          CGO_ENABLED=0 go build -trimpath -buildvcs=false \
            -ldflags "-s -w \
              -X ${MODULE}/internal/buildinfo.Version=${VERSION} \
              -X ${MODULE}/internal/buildinfo.Commit=${COMMIT} \
              -X ${MODULE}/internal/buildinfo.BuildDate=${BUILD_DATE} \
              -X ${MODULE}/internal/buildinfo.BuildType=release" \
            -o dist/ai-proxy-service ./cmd/server

      - name: Package
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          VERSION="${VERSION#v}"
          # The self-updater matches assets by the _linux_<arch>.tar.gz suffix
          # and extracts the "ai-proxy-service" entry — keep both names stable.
          tar -czf "dist/ai-proxy-service_${VERSION}_linux_${{ matrix.goarch }}.tar.gz" \
            -C dist ai-proxy-service

      - uses: actions/upload-artifact@v7
        with:
          name: archive-linux-${{ matrix.goarch }}
          path: dist/*.tar.gz
          retention-days: 3

  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum *.tar.gz > checksums.txt

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          # Published here, in this public repo, with the built-in GITHUB_TOKEN.
          # tag_name is explicit so manual dispatches create the tag; a tag-push
          # trigger simply attaches the release to the tag that already exists.
          tag_name: ${{ needs.prepare.outputs.version }}
          name: ${{ needs.prepare.outputs.version }}
          body: |
            Automated release build of `ai-proxy-service` ${{ needs.prepare.outputs.version }}
            (built from source ref `${{ needs.prepare.outputs.source_ref }}`).

            Linux amd64/arm64 binaries plus `checksums.txt`. Source and docs live
            in the private source repository.
          files: dist/*
